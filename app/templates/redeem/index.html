{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>兑换接码</h1>
  {% if error %}
    <p class="alert error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/redeem/check" class="stack">
    <label for="code">CDK</label>
    <input id="code" name="code" value="{{ code or '' }}" autocomplete="off" placeholder="CDK-XXXX-XXXX-XXXX-XXXX" required>
    <button type="submit">继续</button>
  </form>
</section>
{% endblock %}
